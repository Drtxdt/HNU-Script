[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-lexer-killer"
dynamic = ["version"]
description = "Chinese offline regex, NFA and DFA teaching laboratory"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.1"]

[project.scripts]
compiler-lexer-cli = "compiler_lexer_killer.cli:main"

[tool.setuptools.packages.find]
include = ["compiler_lexer_killer*"]

[tool.setuptools.dynamic]
version = {attr = "compiler_lexer_killer.__version__"}

[tool.setuptools.package-data]
compiler_lexer_killer = ["presets/*.json", "ui/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
